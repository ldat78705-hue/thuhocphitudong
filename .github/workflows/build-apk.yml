name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Get version name
      id: version
      run: |
        VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "Version: $VERSION (code: $VERSION_CODE)"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: GachNo-v${{ steps.version.outputs.version }}-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: GachNo-v${{ steps.version.outputs.version }}-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Get version name
      id: version
      run: |
        VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: List and rename APK
      run: |
        echo "=== Release APK files ==="
        find app/build/outputs/apk/ -name "*.apk" -type f
        # Rename for clarity
        for f in app/build/outputs/apk/release/*.apk; do
          if [ -f "$f" ]; then
            cp "$f" "app/build/outputs/apk/release/GachNo-v${{ steps.version.outputs.version }}.apk"
            echo "Renamed: $f -> GachNo-v${{ steps.version.outputs.version }}.apk"
          fi
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: GachNo v${{ steps.version.outputs.version }}
        body: |
          ## GachNo v${{ steps.version.outputs.version }}

          ### 🛡️ Pipeline 9 lớp bảo vệ — Không sót, Không trùng:
          1. Snapshot immutable trên binder thread
          2. Async processing (không block binder pool)
          3. WakeLock 30s chống CPU sleep
          4. P1: txId dedup (ACSP/FT/HS+amount+SD, 24h TTL)
          5. P2: Amount+SD cross-app dedup (skip InboxStyle)
          6. P3: Fingerprint + line index dedup
          7. UniqueWork KEEP (deterministic, chống trùng sau restart)
          8. scanActiveNotifications khi reconnect (bắt GD bị sót)
          9. ServiceWatchdog 5-phút alarm (phục hồi nhanh)

          ### 🔧 15 bugs đã fix (v2.2.0 → v2.3.0):
          - ✅ SD-based dedup: Phân biệt 2 GD cùng HS + cùng số tiền
          - ✅ InboxStyle: Xử lý đúng khi MB Bank gom nhiều GD
          - ✅ Reverse-alias: SMS đến trước push vẫn dedup chính xác
          - ✅ UniqueWork always: Chống trùng kể cả khi txId=null
          - ✅ scanActiveNotifications: Quét shade khi service khôi phục
          - ✅ ServiceWatchdog: AlarmManager 5 phút kiểm tra + tự sửa

          ### 🏦 Hỗ trợ đa ngân hàng:
          - MB Bank (ACSP, FT), VPBank (VPBFT), VCB (MGD), BIDV (So GD)
          - TPBank, Sacombank, Agribank, ACB, Techcombank

          ### 📱 Cài đặt:
          1. Tải file APK bên dưới
          2. Cài đè lên phiên bản cũ (dữ liệu cấu hình giữ nguyên)
          3. Mở app → kiểm tra kết nối webhook
        files: |
          app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
