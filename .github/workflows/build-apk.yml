name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Get version name
      id: version
      run: |
        VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "Version: $VERSION (code: $VERSION_CODE)"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: GachNo-v${{ steps.version.outputs.version }}-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: GachNo-v${{ steps.version.outputs.version }}-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Get version name
      id: version
      run: |
        VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: List and rename APK
      run: |
        echo "=== Release APK files ==="
        find app/build/outputs/apk/ -name "*.apk" -type f
        # Rename for clarity
        for f in app/build/outputs/apk/release/*.apk; do
          if [ -f "$f" ]; then
            cp "$f" "app/build/outputs/apk/release/GachNo-v${{ steps.version.outputs.version }}.apk"
            echo "Renamed: $f -> GachNo-v${{ steps.version.outputs.version }}.apk"
          fi
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: GachNo v${{ steps.version.outputs.version }}
        body: |
          ## GachNo v${{ steps.version.outputs.version }}

          ### 🔧 Sửa lỗi quan trọng:
          - ✅ Không block binder thread — xử lý async, 10 GD cùng lúc không sót
          - ✅ Snapshot notification ngay lập tức — chống mất dữ liệu khi bank update notif
          - ✅ Extract mã HS + số tiền cho dedup chính xác (HS_193_400000)
          - ✅ Atomic dedup (putIfAbsent) — không race condition giữa 2 thread
          - ✅ FT-only prefix match — tránh dedup nhầm HS193/HS184
          - ✅ Ưu tiên +amount — không match nhầm số dư SD
          - ✅ Retry webhook 3 lần, backoff 15s
          - ✅ WakeLock đúng thời điểm

          ### 📱 Cài đặt:
          1. Tải file APK bên dưới
          2. Cài đè lên phiên bản cũ (dữ liệu cấu hình giữ nguyên)
          3. Mở app → kiểm tra kết nối webhook
        files: |
          app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
